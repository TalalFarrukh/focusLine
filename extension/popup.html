<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusLine Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>FocusLine</h1>
      <p class="subtitle">AI Content Filter</p>
    </header>

    <div class="status-section">
      <div class="status-item">
        <span class="status-label">Extension Status:</span>
        <span class="status-value" id="extension-status">Loading...</span>
      </div>
      <div class="status-item">
        <span class="status-label">Backend Status:</span>
        <span class="status-value" id="backend-status">Loading...</span>
      </div>
    </div>

    <div class="settings-section">
      <h2>Settings</h2>
      
      <div class="setting-group">
        <label class="setting-label">
          <input type="checkbox" id="enabled" class="setting-checkbox">
          <span class="setting-text">Enable FocusLine</span>
        </label>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <input type="checkbox" id="tabBlockingEnabled" class="setting-checkbox">
          <span class="setting-text">Enable Tab Blocking</span>
        </label>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <input type="checkbox" id="contentAnalysisEnabled" class="setting-checkbox">
          <span class="setting-text">Enable Content Analysis</span>
        </label>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <input type="checkbox" id="notificationsEnabled" class="setting-checkbox">
          <span class="setting-text">Show Notifications</span>
        </label>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <span class="setting-text">Sensitivity Level:</span>
          <select id="sensitivity" class="setting-select">
            <option value="low">Low</option>
            <option value="moderate">Moderate</option>
            <option value="high">High</option>
          </select>
        </label>
      </div>

      <div class="setting-group">
        <label class="setting-label">
          <span class="setting-text">Block Threshold (1-10):</span>
          <input type="range" id="blockThreshold" class="setting-range" min="1" max="10" value="7">
          <span class="range-value" id="blockThreshold-value">7</span>
        </label>
      </div>
    </div>

    <div class="actions-section">
      <button id="save-settings" class="btn btn-primary">Save Settings</button>
      <button id="reset-settings" class="btn btn-secondary">Reset to Default</button>
      <button id="clear-cache" class="btn btn-secondary">Clear Cache</button>
    </div>

    <div class="info-section">
      <p class="info-text">Settings are automatically synced across your devices.</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
